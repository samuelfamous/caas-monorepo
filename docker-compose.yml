version: '3.8'

networks:
  caas_backbone_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  caas-postgres-db:
    image: postgres:16-alpine
    container_name: caas_postgres_node
    environment:
      POSTGRES_USER: caas_admin
      POSTGRES_PASSWORD: SecretVaultPassword2026
      POSTGRES_DB: compliance_vault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_volume:/var/lib/postgresql/data
    networks:
      caas_backbone_network:
        ipv4_address: 172.28.0.11
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "max_connections=500"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caas_admin -d compliance_vault"]
      interval: 5s
      timeout: 3s
      retries: 5

  caas-rabbitmq-broker:
    image: rabbitmq:3.13-management-alpine
    container_name: caas_rabbitmq_node
    environment:
      RABBITMQ_DEFAULT_USER: broker_operator
      RABBITMQ_DEFAULT_PASS: PerimeterPassword2026
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      caas_backbone_network:
        ipv4_address: 172.28.0.12
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 5s
      retries: 3

  caas-redis-cache:
    image: redis:7.2-alpine
    container_name: caas_redis_node
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      caas_backbone_network:
        ipv4_address: 172.28.0.13
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 3

volumes:
  postgres_data_volume:
    driver: local