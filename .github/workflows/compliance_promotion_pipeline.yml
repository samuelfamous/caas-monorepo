name: Tier-0 Polyglot Compliance Promotion Loop

on:
  push:
    branches: [ develop, staging, main ]
  pull_request:
    branches: [ develop, staging, main ]

jobs:
  # Stage 1: Parallel Verification (Matrix Strategy)
  verify-code-quality:
    name: Parallel Compliance Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: service-a-ingress
            name: Go Ingress
            setup: actions/setup-go@v5
            with: { go-version: '1.22' }
            run: |
              go mod tidy
              go test -v ./cmd/...
          - service: service-b-ledger
            name: Rust Ledger
            setup: actions/rust-toolchain@stable
            with: { toolchain: stable }
            run: |
              cargo check
              cargo test --verbose
          - service: service-e-ai
            name: Python AI Risk
            setup: actions/setup-python@v5
            with: { python-version: '3.11' }
            run: |
              pip install -r requirements.txt
              PYTHONPATH=. python -m unittest discover -s tests
          - service: service-c-trust
            name: Java Trust
            setup: actions/setup-java@v4
            with: { java-version: '21', distribution: 'temurin' }
            run: mvn clean test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup ${{ matrix.name }}
        uses: ${{ matrix.setup }}
        with: ${{ matrix.with }}
      - name: Verify ${{ matrix.name }}
        run: |
          cd services/${{ matrix.service }}
          ${{ matrix.run }}

  # Stage 2: Staging-Specific High-Throughput Performance Pass
  performance-validation:
    name: Execute Automated k6 Stress Tests
    needs: verify-code-quality
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
      - name: Spin up Infrastructure Containers Mesh
        run: docker compose up --build -d
      - name: Setup Grafana k6 Test Engine
        uses: grafana/setup-k6-action@v1
      - name: Execute Distributed Stress Verification Runs
        run: k6 run tests/load/stress_suite.js
      - name: Teardown Operational Containers Infrastructure
        if: always()
        run: docker compose down -v

  # Stage 3: Secure Automated Container Packaging & Tagging
  package-and-release:
    name: Package Secure Production Containers
    needs: [verify-code-quality, performance-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
      - name: Build Production Image Tags (Go Ingress Gateway)
        run: |
          docker build -t cbn-compliance/service-a-ingress:${{ github.sha }} ./services/service-a-ingress
          docker tag cbn-compliance/service-a-ingress:${{ github.sha }} cbn-compliance/service-a-ingress:latest
      - name: Build Production Image Tags (Rust Cryptographic Ledger)
        run: |
          docker build -t cbn-compliance/service-b-ledger:${{ github.sha }} ./services/service-b-ledger
          docker tag cbn-compliance/service-b-ledger:${{ github.sha }} cbn-compliance/service-b-ledger:latest
      - name: Log Out Deployment Success Manifest
        run: echo "Deployment package generation pipeline completed successfully for release version ${{ github.sha }}."