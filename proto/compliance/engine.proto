syntax = "proto3";

package compliance.engine.v1;

option go_package = "github.com/caas/monorepo/proto/compliance/engine/v1;enginev1";
option java_multiple_files = true;
option java_package = "com.caas.monorepo.proto.compliance.engine.v1";

import "google/protobuf/timestamp.mproto";

// Service controlling the ultra-high throughput compliance ingest boundary.
service ComplianceEngineService {
  // Streams a massive batch of financial ledger transactions for real-time stress testing and risk evaluation.
  rpc EvaluateTransactionStream(stream EvaluateTransactionRequest) returns (EvaluateTransactionResponse);
  
  // Single-request entrypoint for high-priority synchronous compliance approvals.
  rpc CheckComplianceSynchronous(EvaluateTransactionRequest) returns (ComplianceAssessment);
}

enum AssetClass {
  ASSET_CLASS_UNSPECIFIED = 0;
  ASSET_CLASS_SOVEREIGN_BONDS = 1;
  ASSET_CLASS_COMMERCIAL_LOANS = 2;
  ASSET_CLASS_RETAIL_EXPOSURE = 3;
  ASSET_CLASS_OFF_BALANCE_SHEET = 4;
}

enum RiskTier {
  RISK_TIER_UNSPECIFIED = 0;
  RISK_TIER_LOW = 1;
  RISK_TIER_MEDIUM = 2;
  RISK_TIER_HIGH = 3;
  RISK_TIER_CRITICAL = 4;
}

message EvaluateTransactionRequest {
  string transaction_id = 1;
  string tenant_bank_id = 2;
  double nominal_value_ngn = 3;
  AssetClass asset_classification = 4;
  string counterparty_identifier = 5;
  string source_account_hash = 6;
  google.protobuf.Timestamp transaction_timestamp = 7;
}

message ComplianceAssessment {
  string transaction_id = 1;
  bool is_permitted = 2;
  RiskTier computed_risk_tier = 3;
  double capital_reserve_impact_ngn = 4;
  string matching_sanction_rule = 5;
  bool requires_immediate_str_filing = 6;
}

message EvaluateTransactionResponse {
  string batch_execution_id = 1;
  int64 total_processed = 2;
  int64 total_violations_found = 3;
  google.protobuf.Timestamp processing_completed_at = 4;
  repeated ComplianceAssessment violations = 5;
}